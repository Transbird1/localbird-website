<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LocalBird Büro</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    /* Büro-Startseite: Kacheln zu allen Programmen, im Stil der Website (Schwarz, Gold) */
    :root{
      --ink:#121316; --graphite:#1d1f24; --steel:#5d6470; --line:#dfe1e5; --paper:#f5f6f7; --white:#fff;
      --gold:#c9a14a; --gold-deep:#9c7a2e; --gold-soft:#efe3c4;
      --f-display:"Saira","Arial Narrow",system-ui,sans-serif;
      --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
    header{background:var(--ink);color:var(--white);border-bottom:3px solid var(--gold)}
    .wrap{max-width:1040px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
    header .wrap{display:flex;align-items:center;gap:20px;padding-block:22px 26px;flex-wrap:wrap}
    header img{height:52px;width:auto;background:var(--white);border-radius:6px;padding:4px 8px}
    h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.05;margin:0}
    .hello{margin:4px 0 0;color:#c4c8cf;font-size:16px}
    main .wrap{padding-block:28px 48px}
    .grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
    .tile{display:flex;align-items:center;gap:14px;height:100%;padding:18px;background:var(--white);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
    a.tile:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(18,19,22,.08);transform:translateY(-1px)}
    a.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .ico{flex:none;width:52px;height:52px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em}
    .grid li:first-child .ico{background:var(--gold);color:var(--ink)}
    .tile > span:last-child{min-width:0;overflow-wrap:anywhere}
    .tile b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
    .tile span.t{display:block;color:var(--steel);font-size:15px;margin-top:2px}
    .tile.leer{border-style:dashed;background:transparent}
    .tile.leer .ico{background:var(--line);color:var(--steel)}
    .note{margin:26px 0 0;color:var(--steel);font-size:15px;max-width:70ch}
    .note a{color:var(--gold-deep);font-weight:600}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <img src="/assets/logo.png" alt="LocalBird">
      <div>
        <h1>Büro</h1>
        <p class="hello" id="hello">Alle Programme auf einen Blick</p>
      </div>
    </div>
  </header>
  <main>
    <div class="wrap">
      <ul class="grid" id="grid"></ul>
      <p class="note">Tipp: Diese Seite als Lesezeichen speichern oder am Handy „Zum Home-Bildschirm“ hinzufügen. Kacheln ändern, sortieren oder neue anlegen: <a href="/buero/website/">Website bearbeiten</a> → „Büro-Startseite“.</p>
    </div>
  </main>
  <script>
  (function(){
    try{
      var d=new Date(), h=d.getHours();
      var gruss=h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend';
      document.getElementById('hello').textContent=gruss+' · '+d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
    }catch(e){}
    var grid=document.getElementById('grid');
    function kachel(k){
      var li=document.createElement('li');
      var hatLink=!!(k.url&&k.url.trim());
      var el=document.createElement(hatLink?'a':'div');
      el.className='tile'+(hatLink?'':' leer');
      if(hatLink){
        el.href=k.url.trim();
        if(!/^\//.test(el.getAttribute('href'))){el.target='_blank';el.rel='noopener'}
      }
      var ico=document.createElement('span');ico.className='ico';ico.textContent=(k.kuerzel||k.titel||'?').slice(0,2);
      var txt=document.createElement('span');
      var b=document.createElement('b');b.textContent=k.titel||'';
      var t=document.createElement('span');t.className='t';t.textContent=hatLink?(k.text||''):'Adresse noch im Büro eintragen';
      txt.appendChild(b);txt.appendChild(t);el.appendChild(ico);el.appendChild(txt);li.appendChild(el);
      return li;
    }
    fetch('/buero/links.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
      (d.kacheln||[]).forEach(function(k){grid.appendChild(kachel(k))});
    }).catch(function(){
      grid.appendChild(kachel({titel:'Website bearbeiten',text:'Preise, Öffnungszeiten, Aktion, Galerie',url:'/buero/website/',kuerzel:'W'}));
    });
  })();
  </script>
</body>
</html>
